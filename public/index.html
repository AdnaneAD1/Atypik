<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Atypik Driver</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo-img {
      max-width: 220px;
      height: auto;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-radius: 50%;
      border-top-color: #f97316;
      animation: spin 0.8s linear infinite;
    }
    .offline-box {
      display: none;
      margin-top: 16px;
    }
    .offline-box.visible {
      display: block;
    }
    .btn-retry {
      margin-top: 12px;
      padding: 10px 24px;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <img src="/logo-atypik.png" alt="Atypik Driver" class="logo-img" />
  <p class="subtitle" id="status-text">Connexion à votre espace de transport...</p>
  <div class="spinner" id="spinner"></div>

  <div class="offline-box" id="offline-box">
    <p style="color: #ef4444; font-size: 0.85rem;">Aucune connexion Internet détectée.</p>
    <button class="btn-retry" onclick="window.location.reload()">Réessayer</button>
  </div>

  <script>
    if (!navigator.onLine) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status-text').style.display = 'none';
      document.getElementById('offline-box').classList.add('visible');
    }
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
